<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    .product-tile {
      width: 300px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .product-title {
      font-size: 20px;
      font-weight: bold;
    }

    .product-price {
      color: green;
      font-size: 18px;
      margin-top: 10px;
    }

    .product-brand {
      color: gray;
      margin-top: 5px;
    }

    .product-category {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>Product Display</h1>

  <div class="product-tile">
    <div class="product-title">iPhone 15</div>
    <div class="product-price">₹80,000</div>
    <div class="product-brand">Apple</div>
    <div class="product-category">Electronics</div>
  </div>

</body>
</html>
